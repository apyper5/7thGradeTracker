<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franklin 7th Grade Tracker</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Theme Progress Reveal Container */
        .theme-reveal-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 400px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .theme-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Reverse radial mask - starts revealed in center, expands outward */
        .theme-reveal-mask {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, transparent 0%, transparent var(--reveal-percent), rgba(0,0,0,0.95) var(--reveal-percent), rgba(0,0,0,0.95) 100%);
            transition: --reveal-percent 0.5s ease;
        }
        
        /* Theme images */
        .theme-mountains { 
            background-image: url('https://gardenandgun.com/wp-content/uploads/2017/10/Bob-Ross.png');
            background-size: cover;
            background-position: center;
        }
        .theme-ocean { 
            background-image: url('ocean-theme.png');
            background-size: cover;
            background-position: center;
        }
        .theme-space { 
            background-image: url('https://i.redd.it/70mi3md826581.jpg');
            background-size: cover;
            background-position: center;
        }
        .theme-pizza { 
            background-image: url('https://img.freepik.com/premium-vector/candy-pizza-slice-vector-eps-illustration-colorful-geometric_1380826-3466.jpg?semt=ais_hybrid&w=740&q=80');
            background-size: cover;
            background-position: center;
        }
        .theme-corporate { 
            background-image: url('https://kzyfm955.com/wp-content/uploads/2021/07/M_RickAstleyvideostill_072921.jpg');
            background-size: cover;
            background-position: center;
        }
        
        /* Placeholder text for themes */
        .theme-placeholder-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            text-align: center;
            pointer-events: none;
        }
        
        /* Pomodoro Timer Styles */
        .timer-circle {
            transform: rotate(-90deg);
        }
        
        .timer-progress {
            transition: stroke-dashoffset 1s linear;
        }

        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .timer-active .timer-progress {
            animation: pulse-ring 2s ease-in-out infinite;
        }

        .modal-backdrop {
            backdrop-filter: blur(4px);
        }

        /* Theme-based timer colors */
        .theme-mountains .timer-stroke { stroke: #4a5568; }
        .theme-ocean .timer-stroke { stroke: #3182ce; }
        .theme-space .timer-stroke { stroke: #805ad5; }
        .theme-pizza .timer-stroke { stroke: #e53e3e; }
        .theme-corporate .timer-stroke { stroke: #2d3748; }
    </style>
</head>
<body>
    <div id="root">
        <div style="padding: 2rem; text-align: center;">
            <h1 style="font-size: 2rem; margin-bottom: 1rem;">Loading...</h1>
            <p>If this message persists, check the browser console (F12) for errors</p>
        </div>
    </div>
    
    <script>
        console.log('Script starting...');
        
        // SECURE: No API keys exposed - all calls go through Apps Script
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx853Gb0BylD62JN3li9kZHbV_NjcHs1tfuMsaFWZnbgcZjHbJvGsIOAX7DTjPiDNc2og/exec';
        const CLIENT_ID = '326589757916-ce3tt4ji7hcdk1irgg0cv3f08mh1f7qj.apps.googleusercontent.com';
        
        let tokenClient;
        let gisInited = false;
        let currentView = 'login';
        let currentUser = null;
        let selectedStudent = null;
        let studentsList = [];
        let studentData = [];
        let collapsedSections = {};
        let collapsedCategories = {};
        let collapsedDomains = {};
        let studentCollapsedSubjects = {};
        let studentCollapsedCategories = {};
        let studentCollapsedDomains = {};
        let accessToken = null;
        
        function gisLoaded() {
            console.log('GIS loaded');
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/spreadsheets',
                callback: '',
            });
            gisInited = true;
            console.log('Ready! Rendering app...');
            renderApp();
        }
        
        // Call Apps Script securely
        async function callAppsScript(params, method = 'GET') {
            const url = new URL(APPS_SCRIPT_URL);
            
            if (method === 'GET') {
                Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
                const response = await fetch(url);
                return await response.json();
            } else {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(params)
                });
                return await response.json();
            }
        }
        
        function renderApp() {
            console.log('Rendering app, view:', currentView);
            const root = document.getElementById('root');
            
            if (currentView === 'login') {
                root.innerHTML = `
                    <div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">
                        <div class="max-w-4xl mx-auto">
                            <div class="text-center mb-12">
                                <h1 class="text-4xl font-bold text-gray-800 mb-2">Franklin 7th Grade Tracker</h1>
                                <p class="text-gray-600">Student Progress Tracking System</p>
                            </div>
                            <div id="error-message"></div>
                            <div class="grid md:grid-cols-2 gap-8">
                                <div class="bg-white rounded-lg shadow-lg p-8">
                                    <h2 class="text-2xl font-bold text-gray-800 mb-6">Teacher Login</h2>
                                    <button onclick="handleTeacherLogin()" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
                                        Sign in with Google
                                    </button>
                                    <p class="text-xs text-gray-500 mt-2">You will be prompted to sign in with your Google account</p>
                                </div>
                                <div class="bg-white rounded-lg shadow-lg p-8">
                                    <h2 class="text-2xl font-bold text-gray-800 mb-6">Student/Parent Login</h2>
                                    <input type="text" id="student-code" placeholder="Enter access code" class="w-full px-4 py-3 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-green-500">
                                    <button onclick="handleStudentLogin()" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 transition">
                                        View Progress
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentView === 'admin') {
                renderAdminView();
            } else if (currentView === 'student') {
                renderStudentView();
            }
        }
        
        function handleTeacherLogin() {
            console.log('Teacher login clicked');
            
            tokenClient.callback = async (resp) => {
                console.log('OAuth callback received', resp);
                if (resp.error !== undefined) {
                    showError('Authorization failed');
                    return;
                }
                accessToken = resp.access_token;
                currentView = 'admin';
                renderApp();
            };
            
            if (accessToken === null) {
                tokenClient.requestAccessToken({prompt: 'consent'});
            } else {
                tokenClient.requestAccessToken({prompt: ''});
            }
        }
        
        async function handleStudentLogin() {
            console.log('Student login clicked');
            const code = document.getElementById('student-code').value.toUpperCase();
            
            if (!code) {
                showError('Please enter an access code');
                return;
            }
            
            try {
                const result = await callAppsScript({ action: 'studentLogin', code: code });
                
                if (result.error) {
                    showError(result.error);
                    return;
                }
                
                // Store student data
                currentUser = result.student;
                currentUser.progressData = result.progress;
                currentUser.schoolDaysRemaining = result.schoolDaysRemaining || 105;
                currentUser.progressTheme = result.progressTheme || 'mountains';
                currentUser.seenAchievements = result.seenAchievements || [];
                
                currentView = 'student';
                renderApp();
                
                // Check for new achievements after rendering
                setTimeout(() => checkForNewAchievements(), 500);
            } catch (err) {
                console.error('Student login error:', err);
                showError('Failed to connect');
            }
        }
        
        async function renderAdminView() {
            console.log('Rendering admin view');
            const root = document.getElementById('root');
            root.innerHTML = `
                <div class="min-h-screen bg-gray-50 p-8">
                    <div class="max-w-7xl mx-auto">
                        <div class="flex justify-between items-center mb-8">
                            <h1 class="text-3xl font-bold text-gray-800">Teacher Admin Panel</h1>
                            <button onclick="handleLogout()" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700">Logout</button>
                        </div>
                        <div id="save-status" class="mb-4"></div>
                        <div class="bg-white rounded-lg shadow p-6 mb-4">
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Select Student:</label>
                            <select id="student-select" onchange="handleStudentChange()" class="w-full px-4 py-3 border border-gray-300 rounded-lg">
                                <option value="">Loading...</option>
                            </select>
                        </div>
                        <div class="mb-4 flex gap-2">
                            <button onclick="collapseAll()" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 text-sm">Collapse All</button>
                            <button onclick="expandAll()" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 text-sm">Expand All</button>
                        </div>
                        <div id="admin-content">
                            <p>Loading requirements...</p>
                        </div>
                    </div>
                </div>
            `;
            await loadStudentsList();
        }
        
        async function loadStudentsList() {
            try {
                const response = await fetch(APPS_SCRIPT_URL + '?action=getStudentsList');
                const text = await response.text();
                
                // Try to parse as JSON
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    showError('Server returned invalid JSON: ' + text.substring(0, 100));
                    return;
                }
                
                if (data.error) {
                    showError('Error from server: ' + data.error);
                    return;
                }
                
                if (!data.success || !data.students) {
                    showError('Invalid response from server: ' + JSON.stringify(data));
                    return;
                }
                
                studentsList = data.students;
                
                // Load completion percentages for all students
                const studentsWithPercentages = await Promise.all(
                    studentsList.map(async (student) => {
                        try {
                            const result = await callAppsScript({ 
                                action: 'getStudentData', 
                                studentId: student.id 
                            }, 'POST');
                            
                            if (result.success && result.data) {
                                const totalReqs = result.data.length;
                                const completedReqs = result.data.filter(r => r.completed).length;
                                const percentage = totalReqs > 0 ? Math.round((completedReqs / totalReqs) * 100) : 0;
                                return { ...student, percentage };
                            }
                        } catch (err) {
                            console.error('Error loading percentage for', student.name, err);
                        }
                        return { ...student, percentage: 0 };
                    })
                );
                
                studentsList = studentsWithPercentages;
                
                const select = document.getElementById('student-select');
                select.innerHTML = studentsList.map(s => 
                    `<option value="${s.id}">${s.name} - ${s.percentage}% complete</option>`
                ).join('');
                selectedStudent = studentsList[0].id;
                await loadStudentRequirements();
            } catch (err) {
                showError('Failed to load students: ' + err.message);
            }
        }
        
        async function handleStudentChange() {
            selectedStudent = document.getElementById('student-select').value;
            await loadStudentRequirements();
        }
        
        async function loadStudentRequirements() {
            try {
                const result = await callAppsScript({ 
                    action: 'getStudentData', 
                    studentId: selectedStudent 
                }, 'GET');
                
                if (result.error) {
                    showError(result.error);
                    return;
                }
                
                studentData = result.data;
                studentData.schoolDaysRemaining = result.schoolDaysRemaining || 105;
                renderStudentRequirements();
            } catch (err) {
                console.error('Load requirements error:', err);
                showError('Failed to load requirements: ' + err.message);
            }
        }
        
        function renderStudentRequirements() {
            // Sort studentData before grouping with natural number sorting
            studentData.sort((a, b) => {
                if (a.subject !== b.subject) return a.subject.localeCompare(b.subject);
                if (a.track !== b.track) return a.track.localeCompare(b.track);
                if (a.category !== b.category) return a.category.localeCompare(b.category, undefined, {numeric: true, sensitivity: 'base'});
                
                // Extract letter prefix from domain (e.g., "A.", "AA.", "B.", "BB.")
                const aDomainLetter = a.domain.match(/^([A-Z]+)\./)?.[1] || '';
                const bDomainLetter = b.domain.match(/^([A-Z]+)\./)?.[1] || '';
                
                if (aDomainLetter && bDomainLetter && aDomainLetter !== bDomainLetter) {
                    // Sort by length first (A before AA), then alphabetically
                    if (aDomainLetter.length !== bDomainLetter.length) {
                        return aDomainLetter.length - bDomainLetter.length;
                    }
                    return aDomainLetter.localeCompare(bDomainLetter);
                }
                
                // If domains are the same, sort by requirement IXL number (e.g., "1.", "2.", "10.")
                const aReqNum = a.requirement.match(/^(\d+)\./)?.[1];
                const bReqNum = b.requirement.match(/^(\d+)\./)?.[1];
                
                if (aReqNum && bReqNum) {
                    return parseInt(aReqNum) - parseInt(bReqNum);
                }
                
                return a.domain.localeCompare(b.domain, undefined, {numeric: true, sensitivity: 'base'});
            });
            
            const grouped = {};
            studentData.forEach(item => {
                const key = item.subject + '_' + item.track;
                if (!grouped[key]) grouped[key] = { subject: item.subject, track: item.track, categories: {} };
                if (!grouped[key].categories[item.category]) grouped[key].categories[item.category] = {};
                if (!grouped[key].categories[item.category][item.domain]) grouped[key].categories[item.category][item.domain] = [];
                grouped[key].categories[item.category][item.domain].push(item);
            });
            
            // Calculate IXL countdown stats for admin view
            const ixlRequirements = studentData.filter(item => item.category === 'IXL Skills' || item.domain.includes('IXL'));
            
            let html = '';
            
            // Add countdown if there are IXL requirements
            if (ixlRequirements.length > 0) {
                // Split by subject
                const elaIxl = ixlRequirements.filter(item => item.subject === 'ELA');
                const mathIxl = ixlRequirements.filter(item => item.subject === 'Math');
                
                const elaCompleted = elaIxl.filter(item => item.completed).length;
                const elaRemaining = elaIxl.length - elaCompleted;
                const mathCompleted = mathIxl.filter(item => item.completed).length;
                const mathRemaining = mathIxl.length - mathCompleted;
                const totalRemaining = elaRemaining + mathRemaining;
                
                // Read from cell I1
                const daysRemaining = studentData.schoolDaysRemaining || 105;
                const weeksRemaining = daysRemaining / 5;
                
                const elaPerDay = elaRemaining > 0 ? (elaRemaining / daysRemaining).toFixed(1) : 0;
                const elaPerWeek = elaRemaining > 0 ? (elaRemaining / weeksRemaining).toFixed(1) : 0;
                const mathPerDay = mathRemaining > 0 ? (mathRemaining / daysRemaining).toFixed(1) : 0;
                const mathPerWeek = mathRemaining > 0 ? (mathRemaining / weeksRemaining).toFixed(1) : 0;
                
                html += '<div class="bg-gradient-to-r from-green-500 to-teal-600 rounded-lg shadow-lg p-6 mb-8 text-white">';
                html += '<h2 class="text-2xl font-bold mb-4">📅 IXL Countdown to May 22, 2026</h2>';
                
                html += '<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">';
                html += '<div class="bg-white bg-opacity-20 rounded-lg p-4 text-center">';
                html += '<div class="text-4xl font-bold">' + daysRemaining + '</div>';
                html += '<div class="text-sm">School Days Left</div>';
                html += '</div>';
                html += '<div class="bg-white bg-opacity-20 rounded-lg p-4 text-center">';
                html += '<div class="text-4xl font-bold">' + totalRemaining + '</div>';
                html += '<div class="text-sm">Total IXL Skills Left</div>';
                html += '</div>';
                html += '<div class="bg-white bg-opacity-20 rounded-lg p-4 text-center">';
                html += '<div class="text-4xl font-bold">' + weeksRemaining.toFixed(0) + '</div>';
                html += '<div class="text-sm">Weeks Remaining</div>';
                html += '</div>';
                html += '</div>';
                
                // ELA and Math breakdown
                html += '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
                
                // ELA Stats
                if (elaRemaining > 0) {
                    html += '<div class="bg-white bg-opacity-10 rounded-lg p-4">';
                    html += '<h3 class="text-xl font-bold mb-3 text-blue-100">📚 ELA Skills</h3>';
                    html += '<div class="space-y-2">';
                    html += '<div class="flex justify-between"><span>Remaining:</span><strong>' + elaRemaining + ' skills</strong></div>';
                    html += '<div class="flex justify-between"><span>Per Day:</span><strong>' + elaPerDay + ' skills</strong></div>';
                    html += '<div class="flex justify-between"><span>Per Week:</span><strong>' + elaPerWeek + ' skills</strong></div>';
                    html += '</div></div>';
                }
                
                // Math Stats
                if (mathRemaining > 0) {
                    html += '<div class="bg-white bg-opacity-10 rounded-lg p-4">';
                    html += '<h3 class="text-xl font-bold mb-3 text-purple-100">🔢 Math Skills</h3>';
                    html += '<div class="space-y-2">';
                    html += '<div class="flex justify-between"><span>Remaining:</span><strong>' + mathRemaining + ' skills</strong></div>';
                    html += '<div class="flex justify-between"><span>Per Day:</span><strong>' + mathPerDay + ' skills</strong></div>';
                    html += '<div class="flex justify-between"><span>Per Week:</span><strong>' + mathPerWeek + ' skills</strong></div>';
                    html += '</div></div>';
                }
                
                html += '</div>';
                html += '</div>';
            }
            
            for (const [key, data] of Object.entries(grouped)) {
                const sectionId = 'section_' + key.replace(/\s+/g, '_');
                const isCollapsed = collapsedSections[sectionId];
                
                html += '<div class="bg-white rounded-lg shadow p-6 mb-8">';
                html += '<div class="flex justify-between items-center cursor-pointer" onclick="toggleSection(\'' + sectionId + '\')">';
                html += '<h2 class="text-2xl font-bold text-gray-800">' + data.subject + ' - ' + data.track + '</h2>';
                html += '<span class="text-2xl text-gray-600">' + (isCollapsed ? '▼' : '▲') + '</span>';
                html += '</div>';
                html += '<div id="' + sectionId + '" style="display: ' + (isCollapsed ? 'none' : 'block') + '" class="mt-4">';
                
                for (const [cat, domains] of Object.entries(data.categories)) {
                    const catId = sectionId + '_cat_' + cat.replace(/\s+/g, '_').replace(/\./g, '_');
                    const isCatCollapsed = collapsedCategories[catId];
                    
                    html += '<div class="border-l-4 border-indigo-500 pl-4 mb-6">';
                    html += '<div class="flex justify-between items-center cursor-pointer" onclick="toggleCategory(\'' + catId + '\')">';
                    html += '<h3 class="text-lg font-bold text-gray-700">' + cat + '</h3>';
                    html += '<span class="text-lg text-gray-600">' + (isCatCollapsed ? '▼' : '▲') + '</span>';
                    html += '</div>';
                    html += '<div id="' + catId + '" style="display: ' + (isCatCollapsed ? 'none' : 'block') + '" class="mt-3">';
                    
                    for (const [dom, reqs] of Object.entries(domains)) {
                        const domId = catId + '_dom_' + dom.replace(/\s+/g, '_').replace(/\./g, '_');
                        const isDomCollapsed = collapsedDomains[domId];
                        
                        html += '<div class="mb-4">';
                        html += '<div class="flex justify-between items-center cursor-pointer" onclick="toggleDomain(\'' + domId + '\')">';
                        html += '<h4 class="text-md font-semibold text-gray-600">' + dom + '</h4>';
                        html += '<span class="text-sm text-gray-600">' + (isDomCollapsed ? '▼' : '▲') + '</span>';
                        html += '</div>';
                        html += '<div id="' + domId + '" style="display: ' + (isDomCollapsed ? 'none' : 'block') + '" class="space-y-2 mt-2">';
                        
                        for (const req of reqs) {
                            html += '<div class="flex items-center gap-3 bg-gray-50 p-3 rounded">';
                            html += '<input type="text" value="' + req.completed + '" onchange="handleUpdate(' + req.rowNum + ', \'F\', this.value)" placeholder="X" class="w-16 px-2 py-1 border rounded text-center">';
                            html += '<span class="flex-1 text-sm text-gray-700">' + req.requirement + '</span>';
                            html += '<input type="text" value="' + req.note + '" onchange="handleUpdate(' + req.rowNum + ', \'G\', this.value)" placeholder="Note" class="w-48 px-2 py-1 border rounded text-sm">';
                            html += '</div>';
                        }
                        
                        html += '</div></div>';
                    }
                    
                    html += '</div></div>';
                }
                
                html += '</div></div>';
            }
            
            document.getElementById('admin-content').innerHTML = html;
        }
        
        function toggleSection(sectionId) {
            collapsedSections[sectionId] = !collapsedSections[sectionId];
            renderStudentRequirements();
        }
        
        function toggleCategory(catId) {
            collapsedCategories[catId] = !collapsedCategories[catId];
            renderStudentRequirements();
        }
        
        function toggleDomain(domId) {
            collapsedDomains[domId] = !collapsedDomains[domId];
            renderStudentRequirements();
        }
        
        function collapseAll() {
            const sections = document.querySelectorAll('[id^="section_"]');
            sections.forEach(s => {
                if (!s.id.includes('_cat_') && !s.id.includes('_dom_')) {
                    collapsedSections[s.id] = true;
                }
            });
            renderStudentRequirements();
        }
        
        function expandAll() {
            collapsedSections = {};
            collapsedCategories = {};
            collapsedDomains = {};
            renderStudentRequirements();
        }
        
        async function handleUpdate(row, col, value) {
            try {
                const statusDiv = document.getElementById('save-status');
                statusDiv.innerHTML = '<div class="bg-blue-100 text-blue-700 px-4 py-2 rounded">Saving...</div>';
                
                const result = await callAppsScript({
                    action: 'updateCell',
                    studentId: selectedStudent,
                    row: row,
                    col: col,
                    value: value
                }, 'GET');
                
                if (result.error) {
                    statusDiv.innerHTML = '<div class="bg-red-100 text-red-700 px-4 py-2 rounded">Failed: ' + result.error + '</div>';
                } else {
                    statusDiv.innerHTML = '<div class="bg-green-100 text-green-700 px-4 py-2 rounded">Saved ✓</div>';
                    setTimeout(() => statusDiv.innerHTML = '', 2000);
                }
            } catch (err) {
                console.error('Update error:', err);
                document.getElementById('save-status').innerHTML = '<div class="bg-red-100 text-red-700 px-4 py-2 rounded">Failed: ' + err.message + '</div>';
            }
        }
        
        async function renderStudentView() {
            console.log('Rendering student view');
            const root = document.getElementById('root');
            root.innerHTML = `
                <div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-8">
                    <div class="max-w-7xl mx-auto">
                        <div class="flex justify-between items-center mb-8">
                            <h1 class="text-3xl font-bold text-gray-800">${currentUser.name}'s Progress</h1>
                            <button onclick="handleLogout()" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700">Logout</button>
                        </div>
                        <div class="mb-4 flex gap-2">
                            <button onclick="collapseAllStudent()" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 text-sm">Collapse All</button>

                    if (a.track !== b.track) return a.track.localeCompare(b.track);
                    if (a.category !== b.category) return a.category.localeCompare(b.category, undefined, {numeric: true, sensitivity: 'base'});
                    
                    // Extract letter prefix from domain (e.g., "A.", "AA.", "B.", "BB.")
                    const aDomainLetter = a.domain.match(/^([A-Z]+)\./)?.[1] || '';
                    const bDomainLetter = b.domain.match(/^([A-Z]+)\./)?.[1] || '';
                    
                    if (aDomainLetter && bDomainLetter && aDomainLetter !== bDomainLetter) {
                        // Sort by length first (A before AA), then alphabetically
                        if (aDomainLetter.length !== bDomainLetter.length) {
                            return aDomainLetter.length - bDomainLetter.length;
                        }
                        return aDomainLetter.localeCompare(bDomainLetter);

                    const aReqNum = a.requirement.match(/^(\d+)\./)?.[1];

                    if (aReqNum && bReqNum) {

                        /^\d{4}-\d{1,2}-\d{1,2}$/,          // YYYY-MM-DD
                        /^\d{1,2}-\d{1,2}-\d{4}$/,          // MM-DD-YYYY
                        /^[A-Za-z]{3}\s+\d{1,2},?\s+\d{4}$/, // Jan 6, 2026 or Jan 6 2026
                        /^\d{1,2}\/\d{1,2}$/                 // MM/DD (assumes current year)

                    // Check if it looks like a date
                    const looksLikeDate = datePatterns.some(pattern => pattern.test(dateStr));

                            const parsed = new Date(dateStr);
                            if (!isNaN(parsed.getTime())) {

                            }
                        } catch (e) {

        // ============= TO-DO LIST FUNCTIONS =============
        
        function loadTodoList() {
            const today = new Date().toDateString();
            const savedData = localStorage.getItem('studentTodoList');
            
            if (savedData) {
                const data = JSON.parse(savedData);
                // Reset if it's a new day
                if (data.date !== today) {
                    localStorage.setItem('studentTodoList', JSON.stringify({
                        date: today,
                        items: []
                    }));
                    return [];
                }
                return data.items;
            }
            
            localStorage.setItem('studentTodoList', JSON.stringify({
                date: today,
                items: []
            }));
            return [];
        }
        
        function saveTodoList(items) {
            const today = new Date().toDateString();
            localStorage.setItem('studentTodoList', JSON.stringify({
                date: today,
                items: items
            }));
        }
        
        function renderTodoList() {
            const items = loadTodoList();
            const container = document.getElementById('todo-items-container');
            
            if (!container) return;
            
            if (items.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-500 italic text-center py-4">No tasks yet. Add one below!</p>';
                return;
            }
            
            let html = '<ul class="space-y-2">';
            items.forEach((item, index) => {
                const checked = item.completed ? 'checked' : '';
                const lineThrough = item.completed ? 'line-through text-gray-400' : 'text-gray-800';
                
                html += '<li class="flex items-start gap-2 p-2 bg-gray-50 rounded">';
                html += '<input type="checkbox" ' + checked + ' onchange="toggleTodoItem(' + index + ')" class="mt-1 w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500">';
                html += '<span class="flex-1 text-sm ' + lineThrough + '">' + escapeHtml(item.text) + '</span>';
                html += '<button onclick="deleteTodoItem(' + index + ')" class="text-red-500 hover:text-red-700 text-xs">✕</button>';
                html += '</li>';
            });
            html += '</ul>';
            
            const completed = items.filter(i => i.completed).length;
            html += '<p class="text-xs text-gray-500 mt-2 text-center">' + completed + ' of ' + items.length + ' completed</p>';
            
            container.innerHTML = html;
        }
        
        function addTodoItem() {
            const input = document.getElementById('new-todo-input');
            const text = input.value.trim();
            
            if (!text) return;
            
            const items = loadTodoList();
            items.push({
                text: text,
                completed: false
            });
            saveTodoList(items);
            input.value = '';
            renderTodoList();
        }
        
        function toggleTodoItem(index) {
            const items = loadTodoList();
            if (items[index]) {
                items[index].completed = !items[index].completed;
                saveTodoList(items);
                renderTodoList();
            }
        }
        
        function deleteTodoItem(index) {
            const items = loadTodoList();
            items.splice(index, 1);
            saveTodoList(items);
            renderTodoList();
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', function() {

        // ============= POMODORO TIMER FUNCTIONS =============
        
        // Pomodoro Timer State
        let timerState = {
            isRunning: false,
            isPaused: false,
            currentSession: 1,
            sessionType: 'work', // 'work', 'shortBreak', 'longBreak'
            timeRemaining: 25 * 60, // seconds
            totalTimeForSession: 25 * 60,
            interval: null,
            settings: {
                workDuration: 25,
                shortBreak: 5,
                longBreak: 15,
                sessionsBeforeLongBreak: 4,
                dailyGoal: 120,
                soundEnabled: true
            },
            dailyStats: {
                totalWorkMinutes: 0,
                date: new Date().toDateString()
            }
        };

        // Initialize timer on page load
        function initPomodoroTimer() {
            loadSettings();
            loadDailyStats();
            updateDisplay();
            updateTotalWorkTime();
        }

        // Load settings from localStorage
        function loadSettings() {
            const saved = localStorage.getItem('pomodoroSettings');
            if (saved) {
                timerState.settings = JSON.parse(saved);
                
                // Update input fields
                document.getElementById('workDuration').value = timerState.settings.workDuration;
                document.getElementById('shortBreak').value = timerState.settings.shortBreak;
                document.getElementById('longBreak').value = timerState.settings.longBreak;
                document.getElementById('sessionsBeforeLongBreak').value = timerState.settings.sessionsBeforeLongBreak;
                document.getElementById('dailyGoal').value = timerState.settings.dailyGoal;
                document.getElementById('soundToggle').checked = timerState.settings.soundEnabled;
                document.getElementById('workGoal').textContent = timerState.settings.dailyGoal;
            }
            
            // Set initial time based on settings
            timerState.timeRemaining = timerState.settings.workDuration * 60;
            timerState.totalTimeForSession = timerState.settings.workDuration * 60;
        }

        // Save settings to localStorage
        function saveSettings() {
            timerState.settings = {
                workDuration: parseInt(document.getElementById('workDuration').value),
                shortBreak: parseInt(document.getElementById('shortBreak').value),
                longBreak: parseInt(document.getElementById('longBreak').value),
                sessionsBeforeLongBreak: parseInt(document.getElementById('sessionsBeforeLongBreak').value),
                dailyGoal: parseInt(document.getElementById('dailyGoal').value),
                soundEnabled: document.getElementById('soundToggle').checked
            };
            
            localStorage.setItem('pomodoroSettings', JSON.stringify(timerState.settings));
            document.getElementById('workGoal').textContent = timerState.settings.dailyGoal;
            
            // If timer is not running, update the time remaining
            if (!timerState.isRunning) {
                resetTimer();
            }
            
            updateTotalWorkTime();
        }

        // Load daily stats
        function loadDailyStats() {
            const saved = localStorage.getItem('pomodoroDailyStats');
            if (saved) {
                const stats = JSON.parse(saved);
                const today = new Date().toDateString();
                
                // Reset if it's a new day
                if (stats.date !== today) {
                    timerState.dailyStats = {
                        totalWorkMinutes: 0,
                        date: today
                    };
                    saveDailyStats();
                } else {
                    timerState.dailyStats = stats;
                }
            }
        }

        // Save daily stats
        function saveDailyStats() {
            localStorage.setItem('pomodoroDailyStats', JSON.stringify(timerState.dailyStats));
        }

        // Reset daily stats
        function resetDailyStats() {
            if (confirm('Are you sure you want to reset today\'s work time?')) {
                timerState.dailyStats = {
                    totalWorkMinutes: 0,
                    date: new Date().toDateString()
                };
                saveDailyStats();
                updateTotalWorkTime();
            }
        }

        // Open modal
        function openPomodoroTimer() {
            document.getElementById('pomodoroModal').classList.remove('hidden');
            initPomodoroTimer();
            updateDisplay();
        }

        // Close modal
        function closePomodoroTimer() {
            document.getElementById('pomodoroModal').classList.add('hidden');

            }
        }

        // Start timer
        function startTimer() {
            if (!timerState.isRunning) {
                timerState.isRunning = true;
                timerState.isPaused = false;
                
                document.getElementById('startBtn').classList.add('hidden');
                document.getElementById('pauseBtn').classList.remove('hidden');
                document.getElementById('timerSvg').classList.add('timer-active');
                
                timerState.interval = setInterval(tick, 1000);
                updateDisplay();
            }
        }

        // Pause timer
        function pauseTimer() {
            if (timerState.isRunning) {
                timerState.isRunning = false;
                timerState.isPaused = true;
                
                clearInterval(timerState.interval);
                
                document.getElementById('startBtn').classList.remove('hidden');
                document.getElementById('pauseBtn').classList.add('hidden');
                document.getElementById('timerSvg').classList.remove('timer-active');
                
                updateDisplay();
            }
        }

        // Reset timer
        function resetTimer() {
            pauseTimer();
            
            timerState.isPaused = false;
            timerState.currentSession = 1;
            timerState.sessionType = 'work';
            timerState.timeRemaining = timerState.settings.workDuration * 60;
            timerState.totalTimeForSession = timerState.settings.workDuration * 60;
            
            updateDisplay();
        }

        // Skip to next session
        function skipSession() {
            pauseTimer();
            completeSession();
        }

        // Timer tick
        function tick() {
            timerState.timeRemaining--;
            
            if (timerState.timeRemaining <= 0) {
                completeSession();
            }
            
            updateDisplay();
        }

        // Complete session
        function completeSession() {
            pauseTimer();
            
            // Add work time to daily stats if it was a work session
            if (timerState.sessionType === 'work') {
                const workMinutes = Math.floor(timerState.settings.workDuration);
                timerState.dailyStats.totalWorkMinutes += workMinutes;
                saveDailyStats();
                updateTotalWorkTime();
            }
            
            // Play sound if enabled
            if (timerState.settings.soundEnabled) {
                playCompletionSound();
            }
            
            // Move to next session
            if (timerState.sessionType === 'work') {
                // Check if it's time for a long break
                if (timerState.currentSession >= timerState.settings.sessionsBeforeLongBreak) {
                    timerState.sessionType = 'longBreak';
                    timerState.timeRemaining = timerState.settings.longBreak * 60;
                    timerState.totalTimeForSession = timerState.settings.longBreak * 60;
                    timerState.currentSession = 0; // Reset counter after long break
                } else {
                    timerState.sessionType = 'shortBreak';
                    timerState.timeRemaining = timerState.settings.shortBreak * 60;
                    timerState.totalTimeForSession = timerState.settings.shortBreak * 60;
                }
            } else {
                // Break is over, back to work
                timerState.sessionType = 'work';
                timerState.currentSession++;
                timerState.timeRemaining = timerState.settings.workDuration * 60;
                timerState.totalTimeForSession = timerState.settings.workDuration * 60;
            }
            
            updateDisplay();
            showNotification();
        }

        // Update display
        function updateDisplay() {
            // Update time display
            const minutes = Math.floor(timerState.timeRemaining / 60);
            const seconds = timerState.timeRemaining % 60;
            document.getElementById('timerDisplay').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // Update session type
            const sessionTypeText = {
                'work': '💼 Work Session',
                'shortBreak': '☕ Short Break',
                'longBreak': '🌟 Long Break'
            };
            document.getElementById('sessionType').textContent = sessionTypeText[timerState.sessionType];
            
            // Update session counter
            document.getElementById('currentSession').textContent = timerState.currentSession;
            document.getElementById('totalSessions').textContent = timerState.settings.sessionsBeforeLongBreak;
            
            // Update status text
            let statusText = 'Ready to start';
            if (timerState.isRunning) {
                statusText = 'Focus time! 🎯';
            } else if (timerState.isPaused) {
                statusText = 'Paused';
            } else if (timerState.sessionType !== 'work') {
                statusText = 'Time for a break! 😊';
            }
            document.getElementById('timerStatus').textContent = statusText;
            
            // Update progress circle
            const circumference = 2 * Math.PI * 120; // radius is 120
            const progress = timerState.timeRemaining / timerState.totalTimeForSession;
            const offset = circumference * (1 - progress);
            document.getElementById('timerProgress').style.strokeDashoffset = offset;
            
            // Update circle color based on session type
            const colors = {
                'work': '#ef4444',
                'shortBreak': '#3b82f6',
                'longBreak': '#8b5cf6'
            };
            document.getElementById('timerProgress').setAttribute('stroke', colors[timerState.sessionType]);
        }

        // Update total work time display
        function updateTotalWorkTime() {
            const totalMinutes = timerState.dailyStats.totalWorkMinutes;
            const goal = timerState.settings.dailyGoal;
            
            // Update text
            if (totalMinutes >= 60) {
                const hours = Math.floor(totalMinutes / 60);
                const mins = totalMinutes % 60;
                document.getElementById('totalWorkTime').textContent = 
                    `${hours}h ${mins}m`;
            } else {
                document.getElementById('totalWorkTime').textContent = `${totalMinutes} minutes`;
            }
            
            // Update progress bar
            const percentage = Math.min((totalMinutes / goal) * 100, 100);
            document.getElementById('workProgressBar').style.width = `${percentage}%`;
            
            // Change color when goal is reached
            if (percentage >= 100) {
                document.getElementById('workProgressBar').classList.remove('bg-green-500');
                document.getElementById('workProgressBar').classList.add('bg-purple-500');
            } else {
                document.getElementById('workProgressBar').classList.remove('bg-purple-500');
                document.getElementById('workProgressBar').classList.add('bg-green-500');
            }
        }

        // Play completion sound
        function playCompletionSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } catch (err) {
                console.log('Audio not available:', err);
            }
        }

        // Show notification when session completes
        function showNotification() {
            if ('Notification' in window && Notification.permission === 'granted') {
                const messages = {
                    'work': 'Great job! Time for a break. 🎉',
                    'shortBreak': 'Break over! Ready to focus again? 💪',
                    'longBreak': 'Refreshed and ready to go! 🚀'
                };
                new Notification('Focus Timer', {
                    body: messages[timerState.sessionType],
                    icon: '🍅'
                });
            }
        }

        // Request notification permission on first load
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Close modal on escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closePomodoroTimer();
            }
        });
        
        // ============= END POMODORO TIMER FUNCTIONS =============
        
        window.addEventListener('load', () => {
            console.log('Window loaded, starting initialization');
            gisLoaded();
        });
        
        console.log('Script loaded successfully');
    </script>
    
    <!-- Pomodoro Timer Modal -->
    <div id="pomodoroModal" class="fixed inset-0 bg-black bg-opacity-50 modal-backdrop hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            
            <!-- Header -->
            <div class="bg-gradient-to-r from-red-500 to-orange-500 text-white p-6 rounded-t-2xl">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold">🍅 Focus Timer</h2>
                    <button onclick="closePomodoroTimer()" class="text-white hover:text-gray-200 text-3xl leading-none">&times;</button>
                </div>
                <p class="text-red-100 mt-2">Stay focused and take breaks!</p>
            </div>

            <!-- Main Timer Display -->
            <div class="p-8">
                <div class="text-center mb-8">
                    <!-- Session Info -->
                    <div class="mb-4">
                        <span id="sessionType" class="text-2xl font-bold text-gray-700">Work Session</span>
                        <div class="text-gray-500 mt-1">
                            Session <span id="currentSession">1</span> of <span id="totalSessions">4</span>
                        </div>
                    </div>

                    <!-- Circular Timer -->
                    <div class="relative inline-block">
                        <svg class="timer-circle" width="280" height="280" id="timerSvg">
                            <!-- Background circle -->
                            <circle cx="140" cy="140" r="120" fill="none" stroke="#e5e7eb" stroke-width="12"/>
                            <!-- Progress circle -->
                            <circle 
                                id="timerProgress"
                                class="timer-progress timer-stroke"
                                cx="140" 
                                cy="140" 
                                r="120" 
                                fill="none" 
                                stroke="#ef4444" 
                                stroke-width="12"
                                stroke-dasharray="754"
                                stroke-dashoffset="0"
                                stroke-linecap="round"
                            />
                        </svg>
                        <!-- Time Display -->
                        <div class="absolute inset-0 flex items-center justify-center">
                            <div>
                                <div id="timerDisplay" class="text-6xl font-bold text-gray-800">25:00</div>
                                <div id="timerStatus" class="text-gray-500 mt-2">Ready to start</div>
                            </div>
                        </div>
                    </div>

                    <!-- Total Work Time Today -->
                    <div class="mt-6 p-4 bg-gray-50 rounded-lg">
                        <div class="text-sm text-gray-600">Total Work Time Today</div>
                        <div id="totalWorkTime" class="text-2xl font-bold text-gray-800">0 minutes</div>
                        <div class="text-sm text-gray-500 mt-1">
                            Goal: <span id="workGoal">120</span> minutes
                        </div>
                        <!-- Progress bar -->
                        <div class="w-full bg-gray-200 rounded-full h-2 mt-2">
                            <div id="workProgressBar" class="bg-green-500 h-2 rounded-full transition-all" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="flex gap-3 justify-center mb-8">
                    <button 
                        id="startBtn"
                        onclick="startTimer()"
                        class="bg-green-500 hover:bg-green-600 text-white px-8 py-3 rounded-lg font-semibold transition"
                    >
                        Start
                    </button>
                    <button 
                        id="pauseBtn"
                        onclick="pauseTimer()"
                        class="bg-yellow-500 hover:bg-yellow-600 text-white px-8 py-3 rounded-lg font-semibold transition hidden"
                    >
                        Pause
                    </button>
                    <button 
                        onclick="resetTimer()"
                        class="bg-gray-500 hover:bg-gray-600 text-white px-8 py-3 rounded-lg font-semibold transition"
                    >
                        Reset
                    </button>
                    <button 
                        onclick="skipSession()"
                        class="bg-blue-500 hover:bg-blue-600 text-white px-8 py-3 rounded-lg font-semibold transition"
                    >
                        Skip
                    </button>
                </div>

                <!-- Settings Toggle -->
                <div class="border-t pt-6">
                    <button 
                        onclick="toggleSettings()"
                        class="w-full text-left flex items-center justify-between text-gray-700 font-semibold hover:text-gray-900"
                    >
                        <span class="flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                            Timer Settings
                        </span>
                        <svg id="settingsChevron" class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>

                    <!-- Settings Panel -->
                    <div id="settingsPanel" class="hidden mt-4 space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <!-- Work Duration -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">
                                    Work Duration (minutes)
                                </label>
                                <input 
                                    type="number" 
                                    id="workDuration"
                                    value="25"
                                    min="1"
                                    max="60"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent"
                                    onchange="saveSettings()"
                                >
                            </div>

                            <!-- Short Break -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">
                                    Short Break (minutes)
                                </label>
                                <input 
                                    type="number" 
                                    id="shortBreak"
                                    value="5"
                                    min="1"
                                    max="30"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent"
                                    onchange="saveSettings()"
                                >
                            </div>

                            <!-- Long Break -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">
                                    Long Break (minutes)
                                </label>
                                <input 
                                    type="number" 
                                    id="longBreak"
                                    value="15"
                                    min="1"
                                    max="60"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent"
                                    onchange="saveSettings()"
                                >
                            </div>

                            <!-- Sessions Before Long Break -->
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">
                                    Sessions Before Long Break
                                </label>
                                <input 
                                    type="number" 
                                    id="sessionsBeforeLongBreak"
                                    value="4"
                                    min="1"
                                    max="10"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent"
                                    onchange="saveSettings()"
                                >
                            </div>

                            <!-- Daily Work Goal -->
                            <div class="col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-2">
                                    Daily Work Goal (minutes)
                                </label>
                                <input 
                                    type="number" 
                                    id="dailyGoal"
                                    value="120"
                                    min="30"
                                    max="480"
                                    step="30"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent"
                                    onchange="saveSettings()"
                                >
                            </div>
                        </div>

                        <!-- Sound Toggle -->
                        <div class="flex items-center justify-between p-4 bg-gray-50 rounded-lg">
                            <div>
                                <div class="font-medium text-gray-700">Sound Notifications</div>
                                <div class="text-sm text-gray-500">Play a sound when timer completes</div>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" id="soundToggle" class="sr-only peer" checked onchange="saveSettings()">
                                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-red-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-500"></div>
                            </label>
                        </div>

                        <!-- Reset Daily Stats -->
                        <button 
                            onclick="resetDailyStats()"
                            class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg font-medium transition"
                        >
                            Reset Today's Work Time
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
